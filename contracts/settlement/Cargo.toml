[package]
name = "settlement"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
utility-contracts-common = { path = "../common", features = ["wasm"] }
wee_alloc = "0.4.5"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
