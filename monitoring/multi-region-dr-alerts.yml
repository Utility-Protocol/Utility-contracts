groups:
  - name: multi-region-dr
    rules:
      - alert: ReplicationLagHigh
        expr: utility_replication_lag_seconds > 60
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Replication lag exceeds RPO target"
          description: "Replication from {{ $labels.source_region }} to {{ $labels.target_region }} is {{ $value }}s, exceeding the 60s RPO target. Risk of data loss on failover."

      - alert: RegionHealthCritical
        expr: utility_region_health_status == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Region {{ $labels.region }} is unhealthy"
          description: "Region {{ $labels.region }} (role={{ $labels.role }}) has been reporting unhealthy status for 2 minutes. Evaluate failover to standby region."

      - alert: FailoverRPOViolation
        expr: increase(utility_dr_rpo_violation_total[5m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "RPO violation detected"
          description: "One or more RPO violations have been detected in the last 5 minutes. Data loss window may exceed the 60s target if failover occurs now."

      - alert: FailoverRTOViolation
        expr: utility_dr_failover_duration_seconds > 300
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "DR failover exceeded RTO target"
          description: "The DR failover took {{ $value }}s, exceeding the 300s RTO target. Review failover procedure and automation."

      - alert: CrossRegionLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{destination_workload_namespace="utility-contracts"}[5m])) by (le, source_cluster, destination_cluster)) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cross-region P99 latency exceeds 100ms"
          description: "Cross-region request P99 latency from {{ $labels.source_cluster }} to {{ $labels.destination_cluster }} is {{ $value }}ms, exceeding the 100ms critical-path budget."

      - alert: ReplicationBytesZero
        expr: rate(utility_replication_bytes_total[10m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Replication bytes dropped to zero"
          description: "No replication bytes have been observed for region {{ $labels.region }} in the last 10 minutes. Replication may be stalled or disconnected."

      - alert: DRTestStale
        expr: time() - utility_dr_test_last_timestamp_seconds > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "DR test has not run in over 24 hours"
          description: "The last successful DR test for region {{ $labels.region }} (scenario={{ $labels.scenario }}) completed more than 24 hours ago. Run scripts/dr-test.sh to validate readiness."

      - alert: MultiRegionAvailabilityLow
        expr: |
          100 * sum(rate(istio_requests_total{destination_workload_namespace="utility-contracts",response_code!~"5.."}[30m]))
          /
          sum(rate(istio_requests_total{destination_workload_namespace="utility-contracts"}[30m])) < 99.99
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Multi-region availability is below 99.99%"
          description: "The 30-minute rolling availability is {{ $value }}%, below the 99.99% SLO target. Check region health and replication status immediately."

      - alert: DROverallHealthDegraded
        expr: utility_dr_overall_health == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DR overall health is degraded"
          description: "The DR health checker is reporting an unhealthy overall state. Check region health, replication lag, and failover readiness."

      - alert: DRConsecutiveCriticalEvaluations
        expr: utility_dr_consecutive_critical_evaluations >= 3
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "DR health is critical for 3 consecutive evaluations"
          description: "The DR health checker has reported CRITICAL status for {{ $value }} consecutive evaluations. Automatic failover criteria may be met. Verify primary region status."

      - alert: CanaryPromotionBlocked
        expr: utility_dr_canary_decision_total{decision="rollback"} > utility_dr_canary_decision_total offset 5m
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DR canary promotion is blocked by rollback decisions"
          description: "Recent DR canary analysis has produced ROLLBACK decisions, blocking promotion to the next stage. Review P99 latency, availability, and replication lag in the canary slice."
